name: Deploy portal (Manual + Ficha) no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ficha/**"
      - "manual/**"
      - "sistema-base/**"
      - "modulos/**"
      - "cenarios/**"
      - "playtest/geracao-pdf/gerar_manual_pdf.py"
      - ".github/workflows/deploy-ficha.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Ficha (app single-file, base relativa) -> ficha/dist/index.html
      - name: Buildar a ficha
        working-directory: ficha
        run: |
          npm install --no-audit --no-fund
          npm run build

      # 2) Manual (VitePress): gera conteudo limpo, embute a ficha e builda
      - name: Instalar deps do manual
        working-directory: manual
        run: npm install --no-audit --no-fund

      - name: Gerar conteudo limpo do manual
        working-directory: manual
        run: python3 gerar-conteudo.py

      - name: Embutir a ficha no manual (/ficha/)
        run: |
          mkdir -p manual/conteudo/public/ficha
          cp -r ficha/dist/. manual/conteudo/public/ficha/

      - name: Buildar o site do manual
        working-directory: manual
        run: npm run build

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: manual/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
